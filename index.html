<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<script>
/* Applica subito lo stile salvato (prima del rendering, niente lampeggio).
   Puoi anche aprire la pagina con #aurora, #neon, #minimal o #sunset */
(function () {
  var ids = ['aurora', 'neon', 'minimal', 'sunset'], s = 'aurora';
  try {
    var h = (location.hash || '').replace('#', '');
    var saved = localStorage.getItem('home-style');
    if (ids.indexOf(h) > -1) s = h; else if (ids.indexOf(saved) > -1) s = saved;
  } catch (e) {}
  document.documentElement.setAttribute('data-style', s);
})();
</script>
<style>
/* --k = fattore di scala calcolato dallo script: tutte le icone stanno nella finestra senza scroll */
:root{--k:1}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%}
body{
  min-height:100vh;
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);background:var(--bg);
  -webkit-font-smoothing:antialiased;
  transition:background .4s,color .4s;
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}

.wrap{
  min-height:100vh;max-width:1560px;margin:0 auto;
  padding:24px 88px;display:flex;align-items:center;
}
.sections{
  width:100%;display:flex;flex-wrap:wrap;justify-content:center;
  gap:calc(18px * var(--k)) calc(34px * var(--k));
}
.cat{flex:0 0 auto;max-width:100%}
.cat h2{
  display:flex;align-items:center;gap:calc(8px * var(--k));
  margin-bottom:calc(8px * var(--k));padding-left:calc(4px * var(--k));
  font-size:calc(12px * var(--k));font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--cat);
}
.cat h2 .em{font-size:1.25em;letter-spacing:0}
.tiles{display:flex;flex-wrap:wrap;gap:calc(4px * var(--k))}

/* a riposo nessun riquadro: appare solo al passaggio del mouse */
.tile{
  display:flex;flex-direction:column;align-items:center;gap:calc(6px * var(--k));
  width:calc(88px * var(--k));
  padding:calc(8px * var(--k));
  border-radius:calc(var(--radius) * var(--k));
  background:transparent;border:1px solid transparent;box-shadow:none;
  color:var(--label);text-decoration:none;outline:none;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease,background .2s ease;
  animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards;
  animation-delay:calc(var(--i) * 22ms);
}
.tile:hover,.tile:focus-visible{
  transform:translateY(-4px) scale(1.06);
  background:var(--tile-bg);border-color:var(--hover-border);box-shadow:var(--tile-hover);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
}
.tile:active{transform:translateY(-1px) scale(1.02)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.plate{
  width:calc(72px * var(--k));height:calc(72px * var(--k));
  border-radius:calc(21px * var(--k));background:#fff;
  display:grid;place-items:center;overflow:hidden;
  box-shadow:0 4px 12px rgba(0,0,0,.22);
}
.plate img{width:calc(44px * var(--k));height:calc(44px * var(--k));object-fit:contain}
.plate img.full{width:100%;height:100%;object-fit:cover}
html[data-style] .plate.full{background:transparent}
.mono{
  width:100%;height:100%;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:calc(31px * var(--k));background:var(--c);
}
.name{
  font-size:calc(12px * var(--k));font-weight:600;text-align:center;line-height:1.2;
  min-height:2.4em;display:flex;align-items:flex-start;justify-content:center;
  word-break:normal;overflow-wrap:normal;white-space:normal;
}
.hint{font-size:10px;opacity:.7;margin-top:-4px}
.tile.todo{cursor:default;opacity:.6}
.tile.todo:hover{transform:none;background:transparent;border-color:transparent;box-shadow:none}

/* ---------- selettore stile ---------- */
.styles{
  position:fixed;right:10px;top:50%;transform:translateY(-50%);z-index:5;
  display:flex;flex-direction:column;gap:2px;padding:4px;border-radius:14px;
  background:var(--sw-bg);border:1px solid var(--sw-border);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  opacity:.28;transition:opacity .25s ease;
}
.styles:hover,.styles:focus-within{opacity:1}
.styles button{
  all:unset;cursor:pointer;padding:5px 9px;border-radius:10px;text-align:center;
  font-size:11px;font-weight:600;color:var(--sw-text);transition:background .2s,color .2s;
}
.styles button:hover{background:var(--sw-hover)}
.styles button:focus-visible{outline:2px solid var(--sw-active);outline-offset:2px}
.styles button[aria-pressed="true"]{background:var(--sw-active);color:var(--sw-active-text)}

/* ---------- AURORA ---------- */
html[data-style="aurora"]{
  --bg:#0a0e1f;--text:#eef1ff;--muted:#9aa4c7;--cat:#b9c4ff;--label:#eef1ff;
  --radius:20px;
  --tile-bg:rgba(255,255,255,.08);--tile-hover:0 18px 38px -12px rgba(0,0,0,.7);--hover-border:rgba(255,255,255,.4);
  --sw-bg:rgba(15,20,45,.72);--sw-border:rgba(255,255,255,.14);--sw-text:#dfe5ff;
  --sw-hover:rgba(255,255,255,.1);--sw-active:#fff;--sw-active-text:#1b2150;
}
html[data-style="aurora"] body::before{
  background:
    radial-gradient(60% 50% at 15% 10%,rgba(99,102,241,.45),transparent 60%),
    radial-gradient(50% 45% at 85% 20%,rgba(236,72,153,.35),transparent 60%),
    radial-gradient(60% 55% at 50% 100%,rgba(20,184,166,.35),transparent 60%);
  background-size:140% 140%;animation:aur 22s ease-in-out infinite alternate;
}
@keyframes aur{0%{background-position:0% 0%}100%{background-position:100% 100%}}
html[data-style="aurora"] .tile:hover,html[data-style="aurora"] .tile:focus-visible{
  box-shadow:0 20px 40px -12px color-mix(in srgb,var(--c) 75%,transparent),0 0 0 1px color-mix(in srgb,var(--c) 70%,transparent);
  border-color:color-mix(in srgb,var(--c) 70%,#fff);
}

/* ---------- NEON ---------- */
html[data-style="neon"]{
  --bg:#06060d;--text:#f1f1ff;--muted:#8d8db3;--cat:#5ef2ff;--label:#e8e8ff;
  --radius:18px;
  --tile-bg:rgba(255,255,255,.03);--tile-hover:none;--hover-border:#fff;
  --sw-bg:rgba(8,8,20,.8);--sw-border:rgba(94,242,255,.35);--sw-text:#bff8ff;
  --sw-hover:rgba(94,242,255,.12);--sw-active:#5ef2ff;--sw-active-text:#04121a;
}
html[data-style="neon"] body::before{
  background:
    linear-gradient(rgba(94,242,255,.05) 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,rgba(94,242,255,.05) 1px,transparent 1px) 0 0/44px 44px,
    radial-gradient(70% 50% at 50% 0%,rgba(168,85,247,.28),transparent 70%);
}
html[data-style="neon"] .cat h2{text-shadow:0 0 14px rgba(94,242,255,.65)}
html[data-style="neon"] .tile:hover,html[data-style="neon"] .tile:focus-visible{
  border-color:var(--c);
  box-shadow:0 0 28px -2px color-mix(in srgb,var(--c) 85%,transparent),0 0 0 1px var(--c),inset 0 0 18px -6px color-mix(in srgb,var(--c) 70%,transparent);
}
html[data-style="neon"] .plate{box-shadow:0 0 14px -2px color-mix(in srgb,var(--c) 70%,transparent)}

/* ---------- MINIMAL ---------- */
html[data-style="minimal"]{
  --bg:#f5f6f8;--text:#15171c;--muted:#6b7280;--cat:#6b7280;--label:#1f2430;
  --radius:16px;
  --tile-bg:#fff;--hover-border:#d5d9e2;
  --tile-hover:0 2px 4px rgba(16,24,40,.06),0 16px 30px -10px rgba(16,24,40,.22);
  --sw-bg:rgba(255,255,255,.88);--sw-border:#e3e6ec;--sw-text:#374151;
  --sw-hover:#eef0f4;--sw-active:#15171c;--sw-active-text:#fff;
}
html[data-style="minimal"] .tile:hover,html[data-style="minimal"] .tile:focus-visible{-webkit-backdrop-filter:none;backdrop-filter:none}
html[data-style="minimal"] .plate{background:#f3f4f6;box-shadow:inset 0 0 0 1px #e5e7eb}
html[data-style="minimal"] .cat h2{font-size:calc(11.5px * var(--k))}

/* ---------- SUNSET ---------- */
html[data-style="sunset"]{
  --bg:#1f1147;--text:#fff;--muted:#ffe3f0;--cat:#fff;--label:#fff;
  --radius:26px;
  --tile-bg:transparent;--hover-border:rgba(255,255,255,.9);
  --tile-hover:0 22px 40px -8px rgba(20,5,50,.7),0 0 0 3px rgba(255,255,255,.55);
  --sw-bg:rgba(30,10,60,.55);--sw-border:rgba(255,255,255,.3);--sw-text:#fff;
  --sw-hover:rgba(255,255,255,.16);--sw-active:#fff;--sw-active-text:#4a1d7a;
}
html[data-style="sunset"] body::before{
  background:linear-gradient(135deg,#1f1147 0%,#6d28d9 38%,#f43f8e 72%,#ffb347 100%);
  background-size:160% 160%;animation:sun 18s ease-in-out infinite alternate;
}
@keyframes sun{0%{background-position:0% 30%}100%{background-position:100% 70%}}
html[data-style="sunset"] .tile:hover,html[data-style="sunset"] .tile:focus-visible{
  background:linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 52%,#1a0b2e));
  -webkit-backdrop-filter:none;backdrop-filter:none;
}
html[data-style="sunset"] .cat h2{font-size:calc(13px * var(--k));font-weight:800;text-shadow:0 2px 12px rgba(30,5,60,.45)}
html[data-style="sunset"] .plate{border-radius:50%;width:calc(76px * var(--k));height:calc(76px * var(--k))}
html[data-style="sunset"] .name{font-weight:700;text-shadow:0 1px 8px rgba(30,5,60,.5)}

/* telefono: niente adattamento forzato, si scorre */
@media (max-width:640px){
  .wrap{padding:28px 16px 70px;display:block}
  .sections{gap:30px 24px}
  .tile{width:calc((100vw - 32px - 28px) / 3)}
  .styles{left:auto;right:8px;top:auto;bottom:8px;transform:none;flex-direction:row}
  .styles button{padding:5px 8px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none!important;transition:none!important}
}
</style>
</head>

var STYLES = [
  { id: "aurora",  name: "Aurora"  },
  { id: "neon",    name: "Neon"    },
  { id: "minimal", name: "Minimal" },
  { id: "sunset",  name: "Sunset"  }
];

/* ===================== CODICE ===================== */
(function () {
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  var root = document.getElementById("sections"), n = 0;

  SITES.forEach(function (g) {
    var sec = el("section", "cat"), h = el("h2");
    h.appendChild(el("span", "em", g.em));
    h.appendChild(el("span", "", g.cat));
    var box = el("div", "tiles");

    g.items.forEach(function (s) {
      var t = el(s.url ? "a" : "div", "tile" + (s.url ? "" : " todo"));
      if (s.url) t.href = s.url;
      t.title = s.url ? s.name : s.name + " (link da inserire nella lista SITES)";
      t.setAttribute("aria-label", s.name);
      t.style.setProperty("--c", s.c);
      t.style.setProperty("--i", n++);

      var p = el("span", "plate");
      function mono() {
        p.textContent = "";
        p.appendChild(el("span", "mono", s.name.charAt(0).toUpperCase()));
      }
      if (s.icon) {
        p.classList.add("full");
        var ic = new Image();
        ic.alt = ""; ic.className = "full"; ic.onerror = function () { p.classList.remove("full"); mono(); }; ic.src = s.icon;
        p.appendChild(ic);
      } else if (s.domain) {
        var im = new Image();
        im.alt = ""; im.loading = "lazy";
        im.onerror = mono;
        im.src = "https://www.google.com/s2/favicons?domain=" + encodeURIComponent(s.domain) + "&sz=128";
        p.appendChild(im);
      } else mono();

      t.appendChild(p);
      if (!s.url) t.appendChild(el("span", "hint", "da collegare"));
      box.appendChild(t);
    });

    sec.appendChild(h);
    sec.appendChild(box);
    root.appendChild(sec);
  });

  /* Adatta la dimensione delle icone alla finestra: tutto visibile senza scroll.
     Su telefono (schermo stretto) si lascia scorrere. */
  var rootEl = document.documentElement;
  function setK(k) { rootEl.style.setProperty("--k", k.toFixed(3)); }
  function fits() {
    var avail = window.innerHeight - 24 - 24;   /* padding alto/basso della pagina */
    return root.offsetHeight <= avail && root.scrollWidth <= root.clientWidth + 1;
  }
  function fit() {
    if (window.innerWidth <= 640) { setK(1); return; }
    var lo = 0.35, hi = 2.4;
    for (var i = 0; i < 12; i++) {
      var mid = (lo + hi) / 2;
      setK(mid);
      if (fits()) lo = mid; else hi = mid;
    }
    setK(lo);
  }
  var timer;
  window.addEventListener("resize", function () { clearTimeout(timer); timer = setTimeout(fit, 60); });
  window.addEventListener("load", fit);
  fit();

  var nav = document.getElementById("styles");
  function apply(id) {
    document.documentElement.setAttribute("data-style", id);
    try { localStorage.setItem("home-style", id); } catch (e) {}
    Array.prototype.forEach.call(nav.children, function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-id") === id ? "true" : "false");
    });
    fit();
  }
  STYLES.forEach(function (s) {
    var b = el("button", "", s.name);
    b.type = "button";
    b.setAttribute("data-id", s.id);
    b.onclick = function () { apply(s.id); };
    nav.appendChild(b);
  });
  apply(document.documentElement.getAttribute("data-style"));
})();
</script>
</body>
